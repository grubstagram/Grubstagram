name: 2. Publish to Instagram

on:
  schedule:
    - cron: "37 16 * * *"   # 16:37 UTC: UK early evening, US lunchtime
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (blank = today)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: grubstagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for a reject label
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          IN_DATE: ${{ inputs.date }}
        run: |
          DATE="${IN_DATE:-$(date -u +%F)}"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          ISSUE=$(gh issue list --state all --search "\"Post $DATE\" in:title" --json number,labels --jq '.[0] // {}')
          echo "issue=$(echo "$ISSUE" | jq -r '.number // empty')" >> "$GITHUB_OUTPUT"
          if echo "$ISSUE" | jq -e '.labels // [] | map(.name) | index("reject")' > /dev/null; then
            echo "Rejected in review. Skipping $DATE."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish carousel
        id: pub
        if: steps.gate.outputs.skip == 'false'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m grub publish --date "$DATE"

      - name: Record result
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.gate.outputs.issue }}
          LINK: ${{ steps.pub.outputs.permalink }}
        run: |
          git config user.name "grubstagram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue data
          git diff --staged --quiet || { git commit -m "Published $DATE"; git push; }
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --add-label posted --remove-label draft || true
            gh issue close "$ISSUE" --comment "Live: ${LINK:-published}"
          fi
