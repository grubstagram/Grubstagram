name: 3. Refresh Instagram token

# Long-lived Instagram tokens expire after 60 days. This renews it three times a month
# and saves the new one back into the IG_ACCESS_TOKEN secret.
# Needs a GH_PAT secret: a fine-grained token for this repo with "Secrets: Read and write".

on:
  schedule:
    - cron: "19 4 1,11,21 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh and store
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python -m grub refresh-token --out new.token
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < new.token
          rm -f new.token
          echo "Token renewed."
