name: 4. Make music

# Generates a few AI music candidates for a post type and opens an issue with links to listen.
# Run again with "use" set to a number to make that candidate the live track.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Which posts the music is for"
        type: choice
        options: [edible, not_edible]
        default: edible
      prompt:
        description: "Describe the music (blank = the default in config.toml)"
        required: false
        default: ""
      count:
        description: "How many candidates to make (about $0.04 each)"
        required: false
        default: "3"
      use:
        description: "Pick a candidate instead: its number, e.g. 2 (leave blank to generate new ones)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: grubstagram
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make or pick music
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IN_KIND: ${{ inputs.kind }}
          IN_PROMPT: ${{ inputs.prompt }}
          IN_COUNT: ${{ inputs.count }}
          IN_USE: ${{ inputs.use }}
        run: |
          if [ -n "$IN_USE" ]; then
            python -m grub music --kind "$IN_KIND" --use "$IN_USE"
          else
            python -m grub music --kind "$IN_KIND" --count "${IN_COUNT:-3}" --prompt "$IN_PROMPT"
          fi
      - name: Commit
        id: commit
        run: |
          git config user.name "grubstagram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/music config.toml
          if git diff --staged --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Music: ${IN_USE:+use candidate $IN_USE for }${{ inputs.kind }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          IN_USE: ${{ inputs.use }}
      - name: Open listening issue
        if: steps.commit.outputs.changed == 'true' && inputs.use == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create music --color 5319E7 --description "Music candidates" --force
          gh issue create --title "Music candidates: ${{ inputs.kind }} posts" --body-file brand/music/candidates/issue.md --label music
