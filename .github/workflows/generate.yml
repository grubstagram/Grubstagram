name: 1. Generate daily post

on:
  schedule:
    - cron: "13 7 * * *"   # 07:13 UTC every day (morning in Italy)
  workflow_dispatch:
    inputs:
      kind:
        description: "edible or not_edible (blank = follow the schedule)"
        required: false
        default: ""
      date:
        description: "YYYY-MM-DD (blank = today)"
        required: false
        default: ""
      dry_run:
        description: "Sample recipe + placeholder photo, no API spend"
        type: boolean
        default: false
      replace:
        description: "Replace that day's existing draft (e.g. after rejecting it)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: grubstagram
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Make sure ffmpeg is installed (for Reels)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Generate recipe, photo and slides
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IN_KIND: ${{ inputs.kind }}
          IN_DATE: ${{ inputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_REPLACE: ${{ inputs.replace }}
        run: |
          DATE="${IN_DATE:-$(date -u +%F)}"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          ARGS=()
          [ -n "$IN_KIND" ] && ARGS+=(--kind "$IN_KIND")
          [ "$IN_DRY" = "true" ] && ARGS+=(--dry-run --force)
          [ "$IN_REPLACE" = "true" ] && ARGS+=(--force)
          set -o pipefail
          python -m grub generate --date "$DATE" "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/generate.log"

      - name: Commit draft
        id: commit
        run: |
          git config user.name "grubstagram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Draft for $DATE"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review issue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create draft --color FBCA04 --description "Waiting to be posted" --force
          gh label create reject --color B60205 --description "Do not post" --force
          gh label create posted --color 0E8A16 --description "Live on Instagram" --force
          TITLE="Post $DATE: $(jq -r .title "queue/$DATE/recipe.json")"
          gh issue create --title "$TITLE" --body-file "queue/$DATE/issue.md" --label draft

      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create failed --color B60205 --description "A bot run failed" --force
          { echo "The bot couldn't make the post for ${DATE:-today}. [Run log]($RUN_URL)"; echo; echo '```'; tail -n 40 "$RUNNER_TEMP/generate.log" 2>/dev/null || echo "(no log captured)"; echo '```'; echo; echo "Claude can read this issue and fix it. To retry, run *1. Generate daily post* again."; } > "$RUNNER_TEMP/fail.md"
          gh issue create --title "⚠️ Generate failed: ${DATE:-today}" --body-file "$RUNNER_TEMP/fail.md" --label failed

