# Grubstagram settings. Edit freely; secrets live in GitHub Secrets, never here.

[brand]
handle = "@yummers.grubbers"
name = "Yummers Grubbers"

[schedule]
# Cycles by calendar day. Use e.g. ["edible", "edible", "not_edible"] for a 2:1 mix.
pattern = ["edible", "not_edible"]

[llm]
# Anthropic model strings. Writer makes the recipe, checker reviews it.
writer_model = "claude-sonnet-5-5"
checker_model = "claude-haiku-5-5"
max_attempts = 3
history_window = 90   # how many past titles to show the writer so it avoids repeats

[image]
# Any fal.ai text-to-image endpoint. Swap to compare models, e.g.
#   "fal-ai/nano-banana-2"  (~$0.08)   "fal-ai/nano-banana-pro" (~$0.15)
model = "fal-ai/nano-banana-2"
# Extra JSON fields sent to the model. Unknown fields: remove if fal returns 422.
params = { aspect_ratio = "4:5", num_images = 1 }

[image.style]
edible = "Editorial food photograph, 45-degree angle, soft natural window light from the left, shallow depth of field, rustic ceramic plate on a linen-covered wooden table, a few raw ingredients scattered nearby, appetising, true-to-life colours, magazine quality. No people, no hands, no text, no logos."
not_edible = "Editorial food photograph styled exactly like a glossy cookbook, 45-degree angle, soft window light, ceramic plate on a linen-covered table, BUT the dish is clearly built from non-food materials, surreal and comedic, gross-out but not gory, obviously inedible at a glance. No people, no hands, no text, no logos, no blood, no bodily fluids."

[instagram]
api_version = "v26.0"
user_id = "me"          # 'me' works with Instagram Login tokens
use_alt_text = false   # set true to send alt text on the first slide (newer API field; off until your first post works)

[caption]
edible_footer = "🤖 Recipe and photo generated by AI. We test-cook some, not all: use your judgement, cook meat through, and check the allergens."
not_edible_footer = "⚠️ NOT FOOD. This is a joke recipe made by AI. Do not make it, do not eat it, do not dare anyone to."
base_hashtags = ["#aifood", "#airecipes", "#yummersgrubbers"]

# ---------------------------------------------------------------------------
# Seasonal themes. Dates are MM-DD and inclusive; the first matching theme wins.
# Any of these keys can be left out to fall back to the normal settings:
#   force_kind, hashtags, block, edible_brief, not_edible_brief,
#   edible_checker, not_edible_checker, edible_style, not_edible_style
# ---------------------------------------------------------------------------

[[themes]]
name = "Halloween"
emoji = "🎃"
start = "10-24"
end = "10-31"
force_kind = { "10-31" = "not_edible" }   # Halloween night is always a witch's brew
hashtags = ["#halloween", "#halloweenfood", "#witchesbrew"]
# Extra words banned from the joke recipes (plurals included automatically).
block = ["dog", "puppy", "cat", "kitten", "pet", "hamster", "rabbit", "horse", "toadstool", "mushroom", "fungus", "hemlock", "nightshade", "mandrake", "wolfsbane", "belladonna"]

edible_brief = """Invent a real, cookable, genuinely delicious HALLOWEEN recipe for home cooks: it should look spooky but taste great.
Think pumpkin and squash, black squid-ink or black rice, beetroot 'bloody' soups, green 'witch's brew' soups and herb oils,
'mummy' pastry wraps, spiderweb dips, cauldron stews, toffee-apple twists. Under 90 minutes, supermarket ingredients,
sensible quantities, safe cooking (poultry and mince cooked through, no raw egg or raw flour eaten as-is). The name can be
spooky and punny but the food must be real and appetising."""

not_edible_brief = """Invent a gross-out JOKE Halloween recipe: a witch's brew, cauldron broth or wicked pie that is obviously NOT food.
Draw on storybook witchcraft ('eye of newt and toe of frog', bat wings, cobwebs, cauldrons, full moons) and the old British
playground rhyme dishes like 'scab and matter custard' and 'green pus pie' (stirred with a dead TROLL's eye, never a real
animal's). Every ingredient must be clearly fantastical or a theatrical prop: goblin bogeys, troll toenails, dragon scales,
cobweb candyfloss, cyclops eyeballs, swamp sludge, a witch's old sock. Funny, creepy and disgusting, never realistic gore.
Rules: no real pets or farm animals; no real insects; no blood or realistic wounds; no real toxic plants, mushrooms or herbs
(no hemlock, nightshade, mandrake, toadstools); no real chemicals, medicines, drugs or alcohol; no real fire, open flames or
boiling cauldrons in the method; nothing small or plausible enough to become a dare. The method should be comedic spellcraft
('stir widdershins thirteen times under a gibbous moon'), impossible rather than practical. Never call it safe to eat."""

not_edible_checker = """You are a safety editor for a comedy Halloween 'not food' recipe account. Storybook witchcraft, fantasy
creatures and playground gross-out words (scab, pus, snot, bogeys, earwax, slime) are ALLOWED when they are clearly fantastical,
cartoonish or theatrical props. Fail the post if ANY of these apply: it could be mistaken for real, edible food; it features
real pets, farm animals or real insects; it shows realistic gore, blood or wounds; it names real toxic plants, mushrooms or
herbs; it features real chemicals, cleaning products, medicines, drugs or alcohol; the method would be hazardous if copied
(fire, open flames, boiling liquids, heating objects, mixing substances); it is small or plausible enough to become a dare;
it targets or mocks a real person or group; anything implies it is safe to eat."""

edible_style = "Moody Halloween food photograph, 45-degree angle, dark slate or old wooden table, warm candlelight and soft window light, small pumpkins and autumn leaves, faint cobwebs softly out of focus in the background, appetising and true-to-life colours, magazine quality. No people, no hands, no text, no logos."

not_edible_style = "Dark storybook Halloween photograph of a witch's kitchen: an old iron cauldron or chipped enamel pie dish on a gnarled wooden table, candlelight and an eerie green glow, wisps of mist, cobwebs, spell books and glass jars in the background. The 'food' is clearly theatrical props, slime and costume pieces, cartoonish and comedic rather than realistic. No people, no hands, no text, no logos, no blood, no real animals, no flames."
